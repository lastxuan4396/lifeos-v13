services:
  - type: web
    name: lifeos-v13
    runtime: static
    repo: https://github.com/lastxuan4396/lifeos-v13
    branch: main
    autoDeploy: true
    buildCommand: "echo 'No build step for static HTML'"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /
        name: Cache-Control
        value: no-store, max-age=0, s-maxage=0
      - path: /index.html
        name: Cache-Control
        value: no-store, max-age=0, s-maxage=0
      - path: /sw.js
        name: Cache-Control
        value: no-store, max-age=0, s-maxage=0
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
